<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Poké Box - Locations</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <!-- Desktop App Container -->
  <div class="mobile-container">

    <!-- Slide-in Drawer Navigation -->
    <div id="drawer-backdrop" class="drawer-backdrop"></div>
    <nav id="side-drawer" class="side-drawer" aria-label="Slide-out Menu">
      <div class="drawer-logo">
        <img src="images/logo.png" alt="The Poké Box Logo" class="drawer-logo-img">
      </div>
      <div class="drawer-nav">
        <a href="index.html" class="drawer-link">MENU</a>
        <a href="ourstory.html" class="drawer-link">OUR STORY</a>
        <a href="locations.html" class="drawer-link">LOCATIONS</a>
      </div>
    </nav>

    <!-- Top Header -->
    <header class="site-header">
      <!-- Hamburger (mobile only) -->
      <button id="hamburger-btn" class="hamburger-btn" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>

      <!-- Logo -->
      <div class="logo-container">
        <a href="index.html">
          <img src="images/logo.png" alt="The Poké Box Logo" class="header-logo-img">
        </a>
      </div>

      <!-- Desktop Nav (hidden on mobile) -->
      <nav class="desktop-nav" aria-label="Main Navigation">
        <a href="index.html" class="nav-link">Menu</a>
        <a href="ourstory.html" class="nav-link">Our Story</a>
        <a href="locations.html" class="nav-link active">Locations</a>
      </nav>

      <!-- Cart Icon -->
      <div class="header-actions">
        <button class="icon-btn cart-btn" aria-label="Cart" onclick="window.location.href='cart.html'">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Scrollable Content -->
    <main class="main-content">
      <h1 class="page-title">Locations</h1>
      <p class="locations-subtitle">Visit us in person or order ahead for quick pickup at any of our Ontario locations.</p>

      <div id="locations-grid" class="locations-grid">
        <!-- Cards rendered by JS -->
      </div>
    </main>

    <footer class="site-footer">
      <p>&copy; 2022 THE POKÉ BOX COMPANY</p>
    </footer>

  </div>

  <script src="js/script.js"></script>
  <script>
    const LOCATIONS = [
      {
        name: "Financial District",
        address: "36 Toronto St, Toronto, ON M5C 2C5",
        phone: "(416) 555-0191",
        hoursLabel: "Mon - Fri: 11:00 AM - 8:00 PM | Sat - Sun: Closed",
        // Schedule: 0=Sun,1=Mon,...,6=Sat
        schedule: {
          1: { open: 11, close: 20 },
          2: { open: 11, close: 20 },
          3: { open: 11, close: 20 },
          4: { open: 11, close: 20 },
          5: { open: 11, close: 20 }
        }
      },
      {
        name: "Queen West",
        address: "521 Queen St W, Toronto, ON M5V 2B4",
        phone: "(416) 555-0144",
        hoursLabel: "Mon - Sun: 11:30 AM - 9:00 PM",
        schedule: {
          0: { open: 11.5, close: 21 },
          1: { open: 11.5, close: 21 },
          2: { open: 11.5, close: 21 },
          3: { open: 11.5, close: 21 },
          4: { open: 11.5, close: 21 },
          5: { open: 11.5, close: 21 },
          6: { open: 11.5, close: 21 }
        }
      },
      {
        name: "Yonge & Eglinton",
        address: "2150 Yonge St, Toronto, ON M4S 2A8",
        phone: "(416) 555-0182",
        hoursLabel: "Mon - Sun: 11:00 AM - 8:30 PM",
        schedule: {
          0: { open: 11, close: 20.5 },
          1: { open: 11, close: 20.5 },
          2: { open: 11, close: 20.5 },
          3: { open: 11, close: 20.5 },
          4: { open: 11, close: 20.5 },
          5: { open: 11, close: 20.5 },
          6: { open: 11, close: 20.5 }
        }
      },
      {
        name: "Waterloo Campus",
        address: "255 King St N, Waterloo, ON N2J 4V2",
        phone: "(519) 555-0129",
        hoursLabel: "Mon - Sun: 11:30 AM - 8:30 PM",
        schedule: {
          0: { open: 11.5, close: 20.5 },
          1: { open: 11.5, close: 20.5 },
          2: { open: 11.5, close: 20.5 },
          3: { open: 11.5, close: 20.5 },
          4: { open: 11.5, close: 20.5 },
          5: { open: 11.5, close: 20.5 },
          6: { open: 11.5, close: 20.5 }
        }
      }
    ];

    function isOpen(schedule) {
      const now = new Date();
      const day = now.getDay();
      const hours = now.getHours() + now.getMinutes() / 60;
      const today = schedule[day];
      if (!today) return false;
      return hours >= today.open && hours < today.close;
    }

    function renderLocations() {
      const grid = document.getElementById('locations-grid');
      if (!grid) return;

      grid.innerHTML = LOCATIONS.map(loc => {
        const open = isOpen(loc.schedule);
        const mapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(loc.address)}`;

        return `
          <div class="location-card">
            <div class="location-card-header">
              <h2 class="location-name">${loc.name}</h2>
              <span class="location-status ${open ? 'status-open' : 'status-closed'}">${open ? 'OPEN NOW' : 'CLOSED'}</span>
            </div>
            <div class="location-details">
              <p><strong>Address:</strong>  ${loc.address}</p>
              <p><strong>Hours:</strong>  ${loc.hoursLabel}</p>
              <p><strong>Phone:</strong>  ${loc.phone}</p>
            </div>
            <div class="location-actions">
              <a href="index.html" class="location-btn location-btn-pickup">ORDER PICKUP</a>
              <a href="${mapsUrl}" target="_blank" rel="noopener noreferrer" class="location-btn location-btn-directions">DIRECTIONS</a>
            </div>
          </div>
        `;
      }).join('');
    }

    renderLocations();
  </script>
</body>

</html>
